# The actions are pinned to commit SHAs, `setup-uv` to a version and the Python packages by
# `uv.lock`, so nothing here updates on its own. This is what opens the pull request that
# says one has moved.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
