name: census

# Each Monday, and on a dispatch, the seven reference servers are read again and each listing is
# held to the stored one. Nothing waits on the run: a red one says a server's listing moved, which
# is a new study, not a failure of this code.
on:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

# The job reads the repository and writes nothing back.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: the reference servers read live
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7", python-version: "3.15", enable-cache: false }
      - run: uv sync --locked
      # uvx and npx fetch each server at the release `SERVERS` pins; the runner's Node runs npx.
      - run: uv run --no-sync python tools/census.py --refresh --check docs/studies/census.json
