name: test

on: [push, pull_request]

jobs:
  test:
    name: lint, types, tests, published studies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.5", python-version: "3.14", enable-cache: true }
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run python tools/check_markdown.py
      - run: uv run pytest
      # Every published count is one this code still produces.
      - run: uv run python tools/suite.py --check docs/studies/json-schema-test-suite.json
      - run: uv run python tools/case.py examples/helpdesk --check docs/studies/helpdesk.json
      - run: uv run python tools/bench.py --check docs/studies/bench.json
