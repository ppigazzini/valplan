name: test

on: [push, pull_request]

# The job reads the repository and writes nothing back.
permissions:
  contents: read

# A newer push to the same ref supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests, published studies
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.13.7", python-version: "3.15", enable-cache: true }
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run python tools/check_markdown.py
      - run: uv run pytest
      # Every published count is one this code still produces.
      - run: uv run python tools/case.py examples/helpdesk --check docs/studies/helpdesk.json
      - run: uv run python tools/bench.py --check docs/studies/bench.json
      - run: uv run python tools/census.py --check docs/studies/census.json
