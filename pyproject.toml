[project]
name = "valplan"
version = "0.0.1"
description = "Plans tool-using agents by predicate abstraction over valgebra: JSON Schema contracts compiled to decidable sets, contingent tool programs proven well-typed"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pasquale Pigazzini" }]
requires-python = ">=3.14"
dependencies = [
    # The range, length and step markers the compiled schemas carry. valgebra reads them
    # structurally and does not depend on the package, so this is a direct dependency.
    "annotated-types>=0.8.0",
    # `TypedDict(closed=True)` (PEP 728) for the study files is in `typing` from 3.15.
    "typing-extensions>=4.16.0",
    # The decision procedure every abstraction, plan and verdict here rests on. Pre-alpha,
    # so pinned below 0.1, and a 0.0.x minor is a breaking release: the floor moves with
    # each release.
    "valgebra>=0.0.20,<0.1",
]

[dependency-groups]
dev = [
    # The second implementation: `tests/test_properties.py` compares membership on random
    # schemas, and `tools/suite.py --reference` runs it on the optional suite files.
    "jsonschema>=4.26.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valplan"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true

[tool.ty.environment]
python-version = "3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- formatter conflicts: ruff-format owns these ---
    "COM812", "ISC001",
    # --- PEP 649: annotations are lazy natively ---
    "TC001", "TC002", "TC003",
    # --- deliberate ---
    "T201",     # print: the tools ARE command line programs; stdout is their output
    "CPY001",   # missing-copyright-notice: LICENSE covers the tree
    "S311",     # seeded `random.Random` IS the requirement: every draw must reproduce
    "ANN401",   # a JSON value is `Any`: anything `json.loads` returns
    "D105", "D107",
    # --- docstring style: numpy convention ---
    "D203", "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
# The search, the verifier walk and the runner each dispatch on the four step kinds and
# carry two outcomes per kind; split further, each would hide its one invariant.
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# RUF001: the dialect tests are about the characters ruff calls ambiguous.
"tests/*" = ["S101", "D", "ANN", "PLR2004", "INP001", "SLF001", "FBT003", "RUF001"]
"tools/*" = ["INP001"]
"examples/*" = ["INP001", "T201"]
